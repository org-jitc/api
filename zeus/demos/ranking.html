	<script>
		class PeriodPicker {
			constructor(root){
				this.data = {
					startView: 0
				};
				this.root = root;
				this.dateTxt = this.root.querySelector('input');
				this.picker = new Datepicker(this.dateTxt, {
					autohide: true,
					language: 'ja',
					format: 'yyyy-mm-dd',
					todayButton: true,
					todayButtonMode: 1
				});
				this.hourSlt = this.root.querySelector('select');
				this.hourLbl = this.root.querySelector('[for="hs"]');
				this.arrowLeft = this.root.querySelector('i[data-arrow-type="left"]');
				this.arrowRight = this.root.querySelector('i[data-arrow-type="right"]');

				// binding events
				this.arrowLeft.addEventListener('click', this.onLeftClick.bind(this));
				this.arrowRight.addEventListener('click', this.onRightClick.bind(this));

				// initialization
				let option;

				for(let i = 0; i < 24; i++){
					option = document.createElement('option');
					option.value = i;
					option.textContent = i.toString().padStart(2, '0');
					this.hourSlt.appendChild(option);
				}
			}

			get pickerDate(){
				return this.picker.getDate();
			}
			get hour(){
				return this.hourSlt.value;
			}

			onLeftClick(){
				let date = this.picker.getDate();

				if(this.data.startView == 1){
					date.setMonth(date.getMonth() - 1);
				}else{
					date.setDate(date.getDate() - 1);
				}
				this.picker.setDate(date);
			}
			onRightClick(){
				let date = this.picker.getDate();

				if(this.data.startView == 1){
					date.setMonth(date.getMonth() + 1);
				}else{
					date.setDate(date.getDate() + 1);
				}
				this.picker.setDate(date);
			}

			displayHour(flag){

				if(flag){
					this.hourSlt.classList.remove('d-none');
					this.hourLbl.classList.remove('d-none');
					return;
				}
				this.hourSlt.classList.add('d-none');
				this.hourLbl.classList.add('d-none');
			}
			updatePicker(option){
				this.picker.setOptions(option);
				this.data.startView = option.startView;
			}
		}
		function onEnergyTypeChange(){
			filteringSensors();
		}
		function onEnvironmentalTypeChange(){
			filteringSensors();
		}
		function onGranularityChange(){
			let g = granularityRdos.find(rdo => rdo.checked).value;
			fromPeriodPicker.displayHour(g === 'h' || g === '30m');
			toPeriodPicker.displayHour(g === 'h' || g === '30m');

			let format = 'yyyy-mm-dd';
			let startView = 0;

			if(g === 'M'){
				format = 'yyyy-mm';
				startView = 1;
			}
			let option = {
				format: format,
				startView: startView
			};
			fromPeriodPicker.updatePicker(option);
			toPeriodPicker.updatePicker(option);
		}
		function filteringSensors(){
			let energyType = energyTypeRdos.find(rdo => rdo.checked).value;
			let environmentalTypes = environmentalTypeChks.filter(chk => chk.checked).map(chk => chk.value);
			let environmentalValueTypes = environmentalValueTypeChks.filter(chk => chk.checked).map(chk => chk.value).join();

			$(sensorsTable).bootstrapTable('filterBy', {}, {
				filterAlgorithm: row => {
					return row.dataType.includes(energyType) || environmentalTypes.some(envType => row.dataType.includes(envType));
				}
			});
		}
		function createDatetimes(){
			let g = granularityRdos.find(rdo => rdo.checked).value;
			let list = [];
			let fromDate = fromPeriodPicker.pickerDate;

			if(g === 'M'){
				fromDate.setDate(1);
			}
			if(g === 'h' || g === '30m'){
				fromDate.setHours(fromPeriodPicker.hour);
			}else{
				fromDate.setHours(0);
			}
			fromDate.setMinutes(0);
			fromDate.setSeconds(0);
			fromDate.setMilliseconds(0);
			let toDate = toPeriodPicker.pickerDate;

			if(g === 'M'){
				toDate.setDate(1);
			}
			if(g === 'h' || g === '30m'){
				toDate.setHours(toPeriodPicker.hour);
			}else{
				toDate.setHours(0);
			}
			toDate.setMinutes(0);
			toDate.setSeconds(0);
			toDate.setMilliseconds(0);

			while(fromDate.getTime() <= toDate.getTime()){

				if(g === 'M'){
					list.push(`${fromDate.getFullYear()}-${(fromDate.getMonth() + 1).toString().padStart(2, '0')}`);
					fromDate.setMonth(fromDate.getMonth() + 1);
				}else if(g === 'd'){
					list.push(`${fromDate.getFullYear()}-${(fromDate.getMonth() + 1).toString().padStart(2, '0')}-${fromDate.getDate().toString().padStart(2, '0')}`);
					fromDate.setDate(fromDate.getDate() + 1);
				}else if(g === 'h'){
					list.push(`${fromDate.getFullYear()}-${(fromDate.getMonth() + 1).toString().padStart(2, '0')}-${fromDate.getDate().toString().padStart(2, '0')} ${fromDate.getHours().toString().padStart(2, '0')}`);
					fromDate.setHours(fromDate.getHours() + 1);
				}else{
					list.push(`${fromDate.getFullYear()}-${(fromDate.getMonth() + 1).toString().padStart(2, '0')}-${fromDate.getDate().toString().padStart(2, '0')} ${fromDate.getHours().toString().padStart(2, '0')}:${fromDate.getMinutes().toString().padStart(2, '0')}`);
					fromDate.setMinutes(fromDate.getMinutes() + 30);
				}
			}
			return list;
		}
		function createDemandData(size){
			let data = [];

			for(let i = 0; i < size; i++){
				data.push((Math.random() * 100).toFixed(1));
			}
			return data;
		}
		function createEnergyData(size){
			let data = [];

			for(let i = 0; i < size; i++){
				data.push((Math.random() * 200).toFixed(1));
			}
			return data;
		}
		function createEnvData(size){
			let data = [];

			for(let i = 0; i < size; i++){
				data.push((Math.random() * 100).toFixed(1));
			}
			return data;
		}
		// 降順でソーティングし，順番index配列を返す
		function indexesByDesc(...datas){
			let totalData = [];
			let total;

			for(let i = 0, l = datas[0].length; i < l; i++){
				total = null;

				datas.forEach(data => {
					total = total == null? data[i]: total + data[i];
				});
				totalData.push({index: i, value: total});
			}
			totalData.sort((a, b) => b.value - a.value);
			return totalData.map(data => data.index);
		}
		function createGraph(){
			let datetimes = createDatetimes();
			let data = createDemandData(datetimes.length);
			let sortedIndex = indexesByDesc(data);
			let tempData = createEnvData(datetimes.length);

			chartRoot.classList.remove('d-none');
			chart.setOption({
				legend: {
					type: 'scroll'
				},
				tooltip: {},
				xAxis: {
					type: 'category',
					data: sortedIndex.map(index => datetimes[index])
				},
				yAxis: [{
					type: 'value'
				},{
					type: 'value'
				}],
				series: [{
					type: 'bar',
					name: 'デマンド',
					data: sortedIndex.map(index => data[index])
				},{
					type: 'line',
					name: '温1',
					data: sortedIndex.map(index => tempData[index]),
					yAxisIndex: 1
				}]
			}, true);
			chart.resize();
		}
		let chartRoot = document.querySelector('.chart-root');
		let chart = echarts.init(document.querySelector('#chartEl'));
		let energyTypeRdos = [...document.querySelectorAll('[name="energyType"]')];
		let environmentalTypeChks = [...document.querySelectorAll('[name="environmentalType"]')];
		let environmentalValueTypeChks = [...document.querySelectorAll('[name="environmentalValueType"]')];
		let granularityRdos = [...document.querySelectorAll('[name="r"]')];
		let fromPeriodPicker = new PeriodPicker(document.querySelector('[data-el-type="period-picker"][data-picker-type="from"]'));
		let toPeriodPicker = new PeriodPicker(document.querySelector('[data-el-type="period-picker"][data-picker-type="to"]'));
		let graphBtn = document.querySelector('[data-el-type="graph-button"]');
		let sensorsTable = document.querySelector('[data-el-type="sensors-table"]');
		$(sensorsTable).bootstrapTable({
			locale: 'ja',
			columns: [{
				checkbox: true
			}, {
				field: 'typeName',
				title: 'タイプ'
			}, {
				field: 'name',
				title: '対象機器名'
			}, {
				field: 'id',
				visible: false
			}, {
				field: 'dataType',
				visible: false
			}, {
				field: 'type',
				visible: false
			}],
			data: [{
				id: 'D0001',
				name: 'デマンド',
				typeName: '電力量センサー',
				dataType: 'demand,electric',
				type: 1
			}, {
				id: 'E0001',
				name: '電1',
				typeName: '電力量センサー',
				dataType: 'electric',
				type: 1
			}, {
				id: 'E0002',
				name: '電2',
				typeName: '電力量センサー',
				dataType: 'electric',
				type: 1
			}, {
				id: 'T0001',
				name: '温1',
				typeName: '温度センサー',
				dataType: 'te,hu,di',
				type: 1
			}]
		});

		energyTypeRdos.forEach(rdo => rdo.addEventListener('change', onEnergyTypeChange));
		environmentalTypeChks.forEach(chk => chk.addEventListener('change', onEnvironmentalTypeChange));
		granularityRdos.forEach(rdo => rdo.addEventListener('change', onGranularityChange));
		graphBtn.addEventListener('click', createGraph);

		// initialization
		filteringSensors();
		onGranularityChange();
	</script>
