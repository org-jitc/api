<body>
	<style>
		:root {
			--signage-box-width: min(100vh * 4 / 3, 100vw);
			--brand-logo-width: min(var(--signage-box-width) * .25, 300px);

			--facility-title-font-size: 1.8rem;
			--masuring-time-font-size: 1.2rem;
			--category-title-font-size: 1.8rem;
			--data-title-font-size: 1.4rem;
			--data-value-font-size: 3.4rem;
			--data-unit-font-size: 1.4rem;
			--copyright-font-size: 1.4rem;

			--demand-data-column-size: 2;
			--demand-data-row-size: 2;
			--usage-data-column-size: 4;
			--usage-data-row-size: 2;
		}

		html {
			font-size: 12px;
		}

		body {
			margin: 0;
			padding: 0;
			font-family: "Meiryo UI";
			color: black;
			margin: 0;
			padding: 0;
			width: 100vw;
			height: 100vh;
			display: flex;
			justify-content: center;
			align-items: center;
			overflow: hidden;
		}
		
		.signage-box {
			width: var(--signage-box-width);
			aspect-ratio: 4/3;
			display: grid;
			grid-template-columns: 1fr;
			grid-template-rows: auto 1fr auto;
		}
		.signage-box > .signage-header {
			background-color: #C3D69B;
			display: grid;
			grid-template-columns: 1fr 1fr 1fr;
		}
		.signage-box > .signage-header > .brand-logo {
			display: grid;
			align-items: center;
		}
		.signage-box > .signage-header > .brand-logo > .logo {
			width: var(--brand-logo-width);
		}
		.signage-box > .signage-header > .facility {
			color: #4F6228;
			font-size: var(--facility-title-font-size);
		}
		.signage-box
		.signage-header
		.measuring-time {
			color: #C0504D;
			font-size: var(--masuring-time-font-size);
		}
		.signage-box
		.signage-header
		.measuring-time
		.measuring-time-divider {
			border: 1px solid #C0504D;
			align-self: stretch;
		}

		.signage-box > .signage-body {
			background-color: #76933C;
			display: grid;
			grid-template-columns: 1fr;
			grid-template-rows: repeat(2, 1fr);
			gap: .5rem;
		}
		.signage-box > .signage-body > .signage-category {
			display: grid;
			grid-template-columns: 1fr;
			grid-template-rows: auto 1fr;
			gap: 1rem;
		}
		.signage-box > .signage-body > .signage-category > .demand-status {
			display: grid;
			grid-template-columns: 2fr 1fr;
			gap: .5rem;
		}
		.signage-box > .signage-body > .signage-category > .demand-status > .demand-status-data {
			display: grid;
			grid-template-columns: repeat(var(--demand-data-column-size), 1fr);
			grid-template-rows: repeat(var(--demand-data-row-size), 1fr);
			gap: .5rem;
		}

		.signage-box > .signage-body > .signage-category > .usage-data {
			display: grid;
			grid-template-columns: repeat(var(--usage-data-column-size), 1fr);
			grid-template-rows: repeat(var(--usage-data-row-size), 1fr);
			grid-auto-flow: row;
			gap: .5rem;
		}

		.signage-box > .signage-footer {
			color: white;
			font-size: var(--copyright-font-size);
			background-color: #76933C;
		}

		.signage-category > .title {
			color: white;
			font-size: var(--category-title-font-size);
		}

		.data-box {
			background-color: white;
			display: grid;
			grid-template-rows: auto 1fr;
		}
		.multi-data-box {
			background-color: white;
			display: grid;
			grid-template-rows: repeat(2, 1fr);
		}
		.data-box,.multi-data-box
		.title {
			font-size: var(--data-title-font-size);
			text-align: center;
		}
		.data-box
		.data {
			display: grid;
			grid-template-columns: 1fr auto;
			gap: .5rem;
		}
		.data-box .data .value {
			font-size: var(--data-value-font-size);
		}
		.data-box
		.data
		.unit {
			font-size: var(--data-unit-font-size);
		}

		.multi-data-box > .sub-data-box {
			display: grid;
			grid-template-columns: 1fr auto;
		}
		.multi-data-box .title {
			display: grid;
			justify-content: start;
			align-content: center;
		}
		.multi-data-box .value {
			font-size: var(--data-title-font-size);
			display: grid;
			align-content: center;
		}

		.demand-guage {
			background-color: white;
		}
	</style>
	<!-- window size height table -->

						<div class="data-box rounded p-2">
