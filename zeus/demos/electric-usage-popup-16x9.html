	<style>
		:root {
			--aspect-ratio: 16/9;

			--signage-box-width: min(100vh * var(--aspect-ratio), 100vw);

			--data-title-font-size: 1.4rem;

			--copyright-font-size: 1.4rem;

			--demand-data-row-size: 2;
			--usage-data-column-size: 4;
			--usage-data-row-size: 1;

		}

			width: 100vw;

			justify-content: center;

		}
		
		.signage-box {
			width: var(--signage-box-width);
			aspect-ratio: var(--aspect-ratio);
			display: grid;
			grid-template-columns: 1fr;
			grid-template-rows: auto 1fr auto;
		}
		.signage-box > .signage-header {
			background-color: #C3D69B;
			display: grid;
			grid-template-columns: 1fr 1fr 1fr;
		}
		.signage-box > .signage-header > .brand-logo {
			display: grid;
			align-items: center;
		}
		.signage-box > .signage-header > .brand-logo > .logo {
			width: var(--brand-logo-width);
		}
		.signage-box > .signage-header > .facility {
			color: #4F6228;
			font-size: var(--facility-title-font-size);
		}
		.signage-box
		.signage-header
		.measuring-time {
			color: #C0504D;
			font-size: var(--masuring-time-font-size);
		}
		.signage-box
		.signage-header
		.measuring-time
		.measuring-time-divider {
			border: 1px solid #C0504D;
			align-self: stretch;
		}

		.signage-box > .signage-body {
			background-color: #76933C;
			display: grid;
			grid-template-columns: 1fr;
			grid-template-rows: repeat(4, 1fr);
			gap: .5rem;
		}
		.signage-box > .signage-body > .signage-category {
			display: grid;
			grid-template-columns: 1fr;
			grid-template-rows: auto 1fr;
			gap: 1rem;
		}
		.signage-box > .signage-body > .signage-category > .demand-status {
			display: grid;
			grid-template-columns: repeat(var(--demand-data-column-size), 1fr);
			grid-template-rows: repeat(var(--demand-data-row-size), 1fr);
			gap: .5rem;
		}

		.signage-box > .signage-body > .signage-category > .usage-data {
			display: grid;
			grid-template-columns: repeat(var(--usage-data-column-size), 1fr);
			grid-template-rows: repeat(var(--usage-data-row-size), 1fr);
			grid-auto-flow: row;
			gap: .5rem;
		}

		.signage-box > .signage-footer {
			color: white;
			font-size: var(--copyright-font-size);
			background-color: #76933C;
		}

		.signage-category > .title {
			color: white;
			font-size: var(--category-title-font-size);
		}

		.data-box {
			background-color: white;
			display: grid;
			grid-template-rows: auto 1fr;
		}
		.multi-data-box {
			background-color: white;
			display: grid;
			grid-template-rows: repeat(2, 1fr);
		}
		.data-box,.multi-data-box
		.title {
			font-size: var(--data-title-font-size);
			text-align: center;
		}
		.data-box
		.data {
			display: grid;
			grid-template-columns: 1fr auto;
			gap: .5rem;
		}
		.data-box .data .value {
			font-size: var(--data-value-font-size);
		}
		.data-box
		.data
		.unit {
			font-size: var(--data-unit-font-size);
		}

		.multi-data-box > .sub-data-box {
			display: grid;
			grid-template-columns: 1fr auto;
		}
		.multi-data-box .title {
			display: grid;
			justify-content: start;
			align-content: center;
		}
		.multi-data-box .value {
			font-size: var(--data-title-font-size);
			display: grid;
			align-content: center;
		}

		.demand-guage {
			background-color: white;
			grid-column: 4;
			grid-row: 1/3;
		}
		.demand-guage > .chart {
			aspect-ratio: 1/1;
		}
	</style>

	<script src="./js/echarts/echarts.min.js"></script>
	<script src="./js/jquery/jquery-3.5.1.min.js"></script>
	<script src="./js/axios/axios.min.js"></script>
	<script src="./js/axios/axios.interceptors.js"></script>
	<script src="./js/zeus/electricUsage.demandStatus.js"></script>
	<script src="./js/zeus/electricUsage.list.js"></script>
	<script>
		let baseOption = {
			series: [{
				type: 'gauge',
				startAngle: 180,
				endAngle: 0,
				center: ['50%', '80%'],
				radius: '120%',
				axisLine: {
					lineStyle: {
						width: 40
					}
				},
				progress: {
					show: true,
					width: 40,
					itemStyle: {
						color: 'green'
					}
				},
				pointer: {
					icon: 'path://M12.8,0.7l12,40.1H0.7L12.8,0.7z',
					length: '12%',
					width: 20,
					offsetCenter: [0, '-60%'],
					itemStyle: {
						color: 'gray'
					}
				},
				axisTick: {
					show: false
				},
				splitLine: {
					show: false
				},
				axisLabel: {
					show: false
				},
				title: {
					offsetCenter: [0, '10%'],
					fontSize: 20
				},
				detail: {
					fontSize: 30,
					offsetCenter: [0, '-20%'],
					valueAnimation: true,
					color: 'black',
					formatter: function(value){
	
						if(value > 85){
							return '危険';
						}
						if(value > 65){
							return '注意';
						}
						if(value >= 0){
							return '余裕';
						}
						return '-';
					}
				},
				data: [
					{
						value: 85
					}
				]
			}]
		};
		let colorStyle = {
			color: 'green'
		};

		let chartInstance = echarts.init(document.querySelector('#demandStatus'));
		chartInstance.setOption(baseOption);
		chartInstance.setOption({
			series: [{
				progress: {
					itemStyle: colorStyle
				},
				pointer: {
					itemStyle: colorStyle
				},
				data: [{
					value: 65
				}]
			}]
		});

		window.addEventListener('resize', () => chartInstance.resize());
	</script>
