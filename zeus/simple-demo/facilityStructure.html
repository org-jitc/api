    <script>
        class Icons {
            constructor(){
                this.root = document.querySelector('#icons');
                this.iconFilter = this.root.querySelector('#iconFilter');
                this.iconsContainer = this.root.querySelector('#iconsContainer');

                this.iconFilter.addEventListener('keyup', this.onIconFilterKeyUp.bind(this));

                this.prepareIcons();
            }

            onIconFilterKeyUp(){
                let filter = this.iconFilter.value.trim();

                this.iconDoms.forEach(dom => {

                    if(dom.getAttribute('data-class-name').indexOf(filter) >= 0){
                        zeus.showElement(dom);
                    }else{
                        zeus.hideElement(dom);
                    }
                });
            }
            onIconClick(){
                navigator.clipboard.writeText(this.getAttribute('class'));
            }

            async prepareIcons(){
                let resp;
                try{
                    resp = await RestApi.get('css/bootstrap-icons/1/font/bootstrap-icons.json');
                }catch(error){
                    return;
                }
                this.iconDoms = [];

                let div, i, label;

                for(let className in resp){
                    i = document.createElement('i');
                    i.setAttribute('class', `bi bi-${className}`);
                    i.addEventListener('click', this.onIconClick);
                    
                    div = document.createElement('div');
                    div.setAttribute('class', 'col');
                    div.setAttribute('data-class-name', className);
                    div.appendChild(i);

                    this.iconsContainer.appendChild(div);
                    this.iconDoms.push(div);
                }
            }
        }

        const groupTrees = new GroupTrees({
            id: 'groupTrees',
            editable: true,
            expandable: false,
            datas: []
        });
    </script>
